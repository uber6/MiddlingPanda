[package]
name = "middling-panda"
version = "0.1.0"
edition = "2021"
description = "SSH crypto bridge for Linux/WSL2: modern clients to legacy devices (incl. ssh-dss)"
license = "Apache-2.0"

[[bin]]
name = "middling-panda"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
rand = "0.10"
ssh-key = "0.7.0-rc.10"
russh = { version = "0.61", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ssh2 = { version = "0.9", default-features = false }

# libssh2-sys links OpenSSL via pkg-config on Unix; that breaks for musl cross-builds.
[target.'cfg(target_env = "musl")'.dependencies]
ssh2 = { version = "0.9", default-features = false, features = ["vendored-openssl"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
